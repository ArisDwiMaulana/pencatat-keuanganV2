<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catat Transaksi - Pencatat Keuangan</title>
    <!-- Tailwind CSS v4 Browser Script -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- DaisyUI v5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
</head>
<body class="bg-base-200 min-h-screen">
    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <main class="container mx-auto p-4 md:p-6 max-w-2xl">
        <!-- Form Pencatatan -->
        <div class="card bg-base-100 shadow-xl border border-base-300">
            <div class="card-body">
                <div>
                    <h1 class="card-title text-xl font-bold">Catat Transaksi</h1>
                    <p class="text-sm text-base-content/60 mt-1">Catat pemasukan dan pengeluaran Anda dengan cepat.</p>
                </div>

                <!-- Toggle Tipe Transaksi -->
                <div role="tablist" class="tabs tabs-boxed w-full mt-2">
                    <button type="button" role="tab" id="tab-expense" class="tab tab-active flex-1 font-semibold">
                        📤 Pengeluaran
                    </button>
                    <button type="button" role="tab" id="tab-income" class="tab flex-1 font-semibold">
                        📥 Pemasukan
                    </button>
                </div>

                <form id="form-transaction" class="space-y-4 mt-2" novalidate>
                    <!-- Kategori -->
                    <div class="form-control">
                        <label class="label" for="category">
                            <span class="label-text font-semibold">Kategori</span>
                        </label>
                        <select id="category" class="select select-bordered w-full" required>
                            <option value="">Memuat kategori...</option>
                        </select>
                    </div>

                    <!-- Jenis Transaksi -->
                    <div class="form-control">
                        <span class="label">
                            <span class="label-text font-semibold">Jenis Transaksi</span>
                        </span>
                        <div class="flex flex-wrap gap-6">
                            <label class="label cursor-pointer gap-2 py-1">
                                <input type="radio" name="payment_method" value="cash" class="radio radio-primary radio-sm" checked />
                                <span class="label-text">💵 Cash</span>
                            </label>
                            <label class="label cursor-pointer gap-2 py-1">
                                <input type="radio" name="payment_method" value="cashless" class="radio radio-primary radio-sm" />
                                <span class="label-text">💳 Cashless</span>
                            </label>
                        </div>
                    </div>

                    <!-- Nominal -->
                    <div class="form-control">
                        <label class="label" for="amount">
                            <span class="label-text font-semibold">Nominal</span>
                        </label>
                        <label class="input input-bordered flex items-center gap-2 w-full">
                            <span class="font-semibold text-base-content/60">Rp</span>
                            <input type="number" id="amount" class="grow" placeholder="0" min="1" step="any" inputmode="numeric" required />
                        </label>
                    </div>

                    <!-- Tanggal -->
                    <div class="form-control">
                        <label class="label" for="date">
                            <span class="label-text font-semibold">Tanggal</span>
                        </label>
                        <input type="date" id="date" class="input input-bordered w-full" required />
                    </div>

                    <!-- Keterangan -->
                    <div class="form-control">
                        <label class="label" for="note">
                            <span class="label-text font-semibold">Keterangan <span class="text-base-content/50 font-normal">(opsional)</span></span>
                        </label>
                        <input type="text" id="note" class="input input-bordered w-full" placeholder="Misal: Makan siang" maxlength="255" />
                    </div>

                    <div class="form-control mt-2">
                        <button type="submit" id="btn-save" class="btn btn-primary w-full shadow">
                            💾 Simpan
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Transaksi Hari Ini -->
        <div class="card bg-base-100 shadow-xl border border-base-300 mt-6">
            <div class="card-body">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <h2 class="card-title text-lg">Transaksi Hari Ini</h2>
                    <div id="today-summary" class="flex flex-wrap gap-2"></div>
                </div>

                <!-- Loading -->
                <div id="today-loading" class="flex justify-center py-6">
                    <span class="loading loading-spinner loading-md text-primary"></span>
                </div>

                <!-- Empty state -->
                <div id="today-empty" class="hidden text-center py-8">
                    <div class="text-4xl mb-2">🗒️</div>
                    <p class="text-sm text-base-content/60">Belum ada transaksi hari ini.</p>
                </div>

                <!-- Tabel -->
                <div id="today-table-wrapper" class="hidden overflow-x-auto">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Kategori</th>
                                <th>Jenis</th>
                                <th class="text-right">Nominal</th>
                                <th class="text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="today-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/catat.js"></script>
</body>
</html>
