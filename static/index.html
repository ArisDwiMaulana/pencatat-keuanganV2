<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Masuk / Daftar - Pencatat Keuangan</title>
    <!-- Terapkan tema sebelum render untuk menghindari flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("pencatat-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute(
            "data-theme",
            stored || (prefersDark ? "dark" : "light"),
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <!-- Tailwind CSS v4 Browser Script -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- DaisyUI v5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!-- Custom styles -->
    <link href="/css/style.css" rel="stylesheet" type="text/css" />
  </head>
  <body
    class="bg-base-200 min-h-screen flex items-center justify-center p-4 relative overflow-hidden"
  >
    <!-- Toggle tema -->
    <button
      type="button"
      class="btn btn-ghost btn-circle fixed top-4 right-4 z-50 bg-base-100 border border-base-300 shadow-sm"
      data-theme-toggle
      onclick="toggleTheme()"
      aria-label="Ganti tema"
    >
      <span data-theme-icon aria-hidden="true">🌙</span>
    </button>

    <div
      class="card w-full max-w-md bg-base-100 shadow-xl border border-base-300"
    >
      <div class="card-body">
        <!-- Header -->
        <div class="text-center mb-4">
          <h1 class="text-2xl font-bold text-base-content">
            Pencatat Keuangan
          </h1>
          <p class="text-sm text-base-content/60">
            Kelola arus kas pribadi dengan mudah & cepat
          </p>
        </div>

        <!-- Tab Toggle -->
        <div role="tablist" class="tabs tabs-box mb-6 bg-base-200 p-1 pb-1.5">
          <button
            role="tab"
            id="tab-login"
            class="tab tab-active flex-1 font-medium"
          >
            Masuk (Login)
          </button>
          <button role="tab" id="tab-signup" class="tab flex-1 font-medium">
            Daftar (Signup)
          </button>
        </div>

        <!-- Login Form -->
        <form id="form-login" class="space-y-4" novalidate>
          <div class="form-control">
            <label class="label">
              <span class="label-text font-semibold">Username</span>
            </label>
            <input
              type="text"
              id="login-username"
              placeholder="Masukkan username"
              class="input input-bordered w-full"
              required
              autocomplete="username"
              autofocus
            />
          </div>

          <div class="form-control">
            <label class="label">
              <span class="label-text font-semibold">Password</span>
            </label>
            <input
              type="password"
              id="login-password"
              placeholder="••••••••"
              class="input input-bordered w-full"
              required
              autocomplete="current-password"
            />
          </div>

          <div class="form-control mt-6">
            <button
              type="submit"
              id="btn-login"
              class="btn btn-primary w-full shadow"
            >
              Masuk
            </button>
          </div>
        </form>

        <!-- Signup Form -->
        <form id="form-signup" class="space-y-4 hidden" novalidate>
          <div class="form-control">
            <label class="label">
              <span class="label-text font-semibold"
                >Nama Lengkap / Panggilan</span
              >
            </label>
            <input
              type="text"
              id="signup-name"
              placeholder="Misal: John Doe"
              class="input input-bordered w-full"
              required
            />
          </div>

          <div class="form-control">
            <label class="label">
              <span class="label-text font-semibold">Username</span>
            </label>
            <input
              type="text"
              id="signup-username"
              placeholder="Minimal 3 karakter"
              class="input input-bordered w-full"
              required
              autocomplete="username"
              minlength="3"
            />
          </div>

          <div class="form-control">
            <label class="label">
              <span class="label-text font-semibold">Password</span>
            </label>
            <input
              type="password"
              id="signup-password"
              placeholder="Minimal 6 karakter"
              class="input input-bordered w-full"
              required
              autocomplete="new-password"
              minlength="6"
            />
          </div>

          <div class="form-control">
            <label class="label">
              <span class="label-text font-semibold">Konfirmasi Password</span>
            </label>
            <input
              type="password"
              id="signup-confirm-password"
              placeholder="Ulangi password"
              class="input input-bordered w-full"
              required
              autocomplete="new-password"
              minlength="6"
            />
          </div>

          <div class="form-control mt-6">
            <button
              type="submit"
              id="btn-signup"
              class="btn btn-primary w-full shadow"
            >
              Buat Akun
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
